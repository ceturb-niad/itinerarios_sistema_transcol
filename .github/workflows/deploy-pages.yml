name: Converter gpkg e publicar no Pages

on:
  push:
    branches: [main]
    paths: ["itinerarios_transcol.gpkg"]
  workflow_dispatch:  # permite disparo manual pra reprocessar sem precisar de um novo commit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Preparar diretório de publicação
        run: mkdir -p _site

      - name: Converter para GeoJSON
        run: ogr2ogr -f GeoJSON -t_srs EPSG:4326 _site/itinerarios_transcol.geojson itinerarios_transcol.gpkg

      - name: Converter para KML
        run: ogr2ogr -f KML -t_srs EPSG:4326 _site/itinerarios_transcol.kml itinerarios_transcol.gpkg

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy no Pages
        id: deployment
        uses: actions/deploy-pages@v4
